<script>window.__BANK__ = [{"id": "background-0", "section": "Background", "question": "With KV caching enabled, what dominates per-token latency during autoregressive decoding on a modern GPU?", "options": [{"text": "Streaming the model weights and KV cache from GPU memory on every step.", "correct": true, "explanation": "Decode is memory-bandwidth-bound: each new token requires re-reading billions of parameters to do a single token's worth of arithmetic. The compute units sit mostly idle \u2014 which is exactly the waste dLLMs attack with big parallel refinement passes."}, {"text": "The floating-point cost of the matrix multiplications in each layer.", "explanation": "At batch-of-one decode the matmuls are tiny relative to the chip's throughput; the GPU is starved for data, not arithmetic. That's what memory-bandwidth-bound means."}, {"text": "Recomputing attention over the entire prefix from scratch at each step.", "explanation": "That recomputation is precisely what the KV cache eliminates \u2014 keys and values for the prefix are stored and reused."}, {"text": "Sampling the next token from the vocabulary-sized output distribution.", "explanation": "A softmax over ~100k entries is trivial next to moving gigabytes of weights through memory per token."}]}, {"id": "background-1", "section": "Background", "question": "Which statement about the chain-rule factorization <span class='m'>P(x) = &prod;<sub>t</sub> P(x<sub>t</sub> | x<sub>&lt;t</sub>)</span> is true?", "options": [{"text": "It can represent any distribution over sequences; the cost is sequential decoding.", "correct": true, "explanation": "The chain rule is an identity \u2014 every joint distribution factorizes this way (in any order). Autoregression's weakness is computational (N sequential passes, no revision), not representational. That's why dLLMs compete on speed and editability, not on expressiveness."}, {"text": "It can only represent distributions whose dependencies run left to right.", "explanation": "Conditioning on the full prefix captures arbitrary dependencies \u2014 the factorization is fully general. The left-to-right structure constrains computation, not expressiveness."}, {"text": "It assumes each token depends only on the k most recent tokens before it.", "explanation": "That's a Markov assumption; transformers condition on the entire prefix, and the chain rule itself makes no independence assumption at all."}, {"text": "It requires the training corpus itself to be processed left to right.", "explanation": "The factorization is a property of the model's decomposition of probability, not of corpus ordering or training order."}]}, {"id": "background-2", "section": "Background", "question": "Why can't autoregressive generation be parallelized by simply predicting all N tokens in one forward pass?", "options": [{"text": "Each position must condition on sampled values of earlier positions, which don't exist yet.", "correct": true, "explanation": "Training parallelizes fine (teacher forcing: true tokens are known). At inference, position t's input is the sampled token at t\u22121. Predicting everything at once gives N independent marginals that ignore inter-token dependence \u2014 which, notably, is exactly the approximation dLLMs make within a step, then repair by iterating."}, {"text": "The causal attention mask physically prevents computing more than one output per pass.", "explanation": "The mask doesn't stop parallel computation \u2014 during training, all positions' predictions are computed in one masked pass. The blocker at inference is missing inputs, not the mask."}, {"text": "The KV cache is only able to append one new entry per forward pass.", "explanation": "Cache mechanics are a consequence of sequential sampling, not its cause."}, {"text": "The softmax normalization couples all N output positions to each other.", "explanation": "Softmax normalizes over the vocabulary independently at each position; positions aren't coupled through it."}]}, {"id": "background-3", "section": "Background", "question": "DDPM sampling needed ~1,000 steps. Which route did DDIM take to cut that down?", "options": [{"text": "Reformulate sampling as a deterministic process sharing DDPM's marginals \u2014 no retraining.", "correct": true, "explanation": "DDIM's insight: the training loss only depends on the noisy marginals q(x<sub>t</sub>|x<sub>0</sub>), so a whole family of samplers \u2014 including a deterministic one that can skip steps \u2014 reuses the same trained network. The maths section derives it."}, {"text": "Distill the slow sampler into a student network that takes far fewer steps.", "explanation": "That's progressive distillation (Salimans & Ho, 2022) \u2014 a later, different line of work that does require additional training."}, {"text": "Learn the noise schedule \u03b2<sub>t</sub> jointly with the model to shorten the chain.", "explanation": "Schedule learning is the Improved-DDPM / Variational Diffusion Models direction; DDIM changes the sampler, not the schedule or the training."}, {"text": "Replace the U-Net backbone with a transformer to make each pass cheaper.", "explanation": "Architecture swaps (e.g. DiT) change per-step cost. DDIM attacks the number of steps, which is where the 10\u201350\u00d7 came from."}]}, {"id": "background-4", "section": "Background", "question": "A coding agent runs k sequential tool-calling rounds, each generating n tokens. Which cost does switching from an AR model to a dLLM NOT reduce?", "options": [{"text": "The k-round sequential dependency \u2014 round i+1 still waits for round i.", "correct": true, "explanation": "The workflow chain stays sequential no matter how generation works: round i+1's input is round i's output. dLLMs shrink each round from n sequential passes to a few dozen \u2014 that per-round lever is the only one available, which is why Inception leads with the agent use case."}, {"text": "The number of sequential model passes inside each n-token generation.", "explanation": "This is exactly what dLLMs reduce: a few dozen refinement passes instead of n token-by-token passes."}, {"text": "The wall-clock latency of each individual round of the workflow.", "explanation": "Per-round latency drops roughly in proportion to the pass count \u2014 that's the headline speedup."}, {"text": "GPU idle time caused by one-token-at-a-time decoding.", "explanation": "Each dLLM pass processes the whole sequence \u2014 big parallel work that keeps the compute units busy instead of bandwidth-starved."}]}, {"id": "intuition-0", "section": "Intuition", "question": "In a masked-diffusion forward process, \u03b1<sub>t</sub> = 0.25 is the probability a token survives unmasked at time t. For a 12-token sentence, how many tokens do you expect to remain visible?", "options": [{"text": "3", "correct": true, "explanation": "Each token survives independently with probability \u03b1<sub>t</sub>, so the expected count is 12 \u00d7 0.25 = 3. Keeping the \u03b1 convention straight (survival, not corruption) pays off in the maths sections."}, {"text": "9", "explanation": "That's 12 \u00d7 (1 \u2212 \u03b1<sub>t</sub>) \u2014 the expected number of <em>masked</em> tokens. \u03b1<sub>t</sub> is the survival probability."}, {"text": "6", "explanation": "That would be \u03b1<sub>t</sub> = 0.5. Here each token survives with probability 0.25, so 12 \u00d7 0.25 = 3."}, {"text": "4", "explanation": "12 \u00d7 0.25 = 3, not 4 \u2014 the expected visible count is sentence length times the survival probability \u03b1<sub>t</sub>."}]}, {"id": "intuition-1", "section": "Intuition", "question": "When a dLLM commits several tokens in a single reverse step, what is the precise statistical error being made?", "options": [{"text": "Tokens are drawn from independent per-position marginals, ignoring their joint dependence.", "correct": true, "explanation": "Within one pass the model outputs a separate distribution per blank; sampling them together is a mean-field (factorized) approximation of the true joint. Hence \u201chot cream\u201d: two individually reasonable marginals, jointly wrong."}, {"text": "Tokens are drawn from the prior over the vocabulary rather than from the posterior.", "explanation": "Each marginal genuinely is the model's posterior for that position given the current context \u2014 the flaw is sampling them jointly as if independent, not using the wrong distribution per position."}, {"text": "The step reuses stale logits that were computed before the previous step's commits.", "explanation": "Each step runs a fresh forward pass over the updated sequence; the error is within-step independence, not staleness across steps."}, {"text": "Low-probability tokens can never be committed, biasing output toward frequent words.", "explanation": "Confidence-based ordering changes <em>when</em> a position is decided, not what can be sampled there; rare tokens still win when context demands them."}]}, {"id": "intuition-2", "section": "Intuition", "question": "Architecturally, what is the key difference between a masked dLLM and a GPT-style autoregressive transformer?", "options": [{"text": "It drops the causal attention mask, letting every position attend to every other.", "correct": true, "explanation": "That's essentially it \u2014 same transformer, bidirectional attention, trained to predict masked slots instead of next tokens. The magnitude of the behavioral change (parallel, revisable generation) versus the smallness of the architectural change is the striking part."}, {"text": "It adds a separate encoder whose output feeds cross-attention into a decoder.", "explanation": "No encoder\u2013decoder split is needed; a single bidirectional stack does everything."}, {"text": "It replaces learned positional information with the masking schedule \u03b1<sub>t</sub>.", "explanation": "Positional encodings remain; the schedule governs corruption during training and sampling, not position."}, {"text": "It widens the output head to predict an entire block of tokens jointly.", "explanation": "The head is still per-position over the vocabulary \u2014 that per-position independence is precisely the approximation discussed above."}]}, {"id": "intuition-3", "section": "Intuition", "question": "Why can a vanilla masked-diffusion sampler never revise a token it has committed?", "options": [{"text": "Its reverse posterior assigns probability 1 to carrying over any revealed token.", "correct": true, "explanation": "In the reverse process of absorbing-state diffusion, an unmasked token stays itself with certainty \u2014 mask is absorbing forward, revealed is absorbing backward. ReMDM modifies the <em>sampler's</em> kernel to reopen that door."}, {"text": "Remasked inputs would be out-of-distribution, so revising requires retraining first.", "explanation": "Instructively false: a remasked token is indistinguishable from an ordinarily masked one, which is exactly why ReMDM works on a pretrained model with no retraining."}, {"text": "The attention mask hides committed positions from all later reverse steps.", "explanation": "Attention is fully bidirectional \u2014 committed tokens are visible everywhere; they just can't transition back to mask under the vanilla kernel."}, {"text": "Any revision would invalidate the ELBO bound that was used during training.", "explanation": "The training bound constrains the learned model, not the sampler you run afterwards; ReMDM changes only the sampling procedure."}]}, {"id": "intuition-4", "section": "Intuition", "question": "You cut a dLLM sampler from 64 steps to 16 for a 512-token generation. What necessarily happens?", "options": [{"text": "About 4\u00d7 more tokens are committed per step, compounding independence errors.", "correct": true, "explanation": "512 tokens over 16 steps means ~32 commits per step instead of ~8 \u2014 more simultaneous, independently-sampled decisions per pass, hence more \u201chot cream\u201d. That's the speed\u2013quality dial in mechanical terms."}, {"text": "The model must be fine-tuned on the shorter schedule before quality recovers.", "explanation": "Step count is an inference-time choice; the same network serves any number of steps (MDLM's objective is even invariant to the schedule \u2014 see the maths)."}, {"text": "The training NELBO increases because fewer corruption levels get integrated over.", "explanation": "The training objective integrates over continuous corruption levels and never sees the sampler's step count."}, {"text": "Latency stays roughly the same, since each step must now do 4\u00d7 the work.", "explanation": "Each step is one full-sequence forward pass regardless of how many tokens it commits \u2014 so 16 steps costs about a quarter of 64. That's the whole point."}]}, {"id": "math-continuous-0", "section": "The Maths I: Continuous Diffusion", "question": "Suppose &#8113;<sub>t</sub> = 0.64. Which is the correct one-jump corruption distribution q(x<sub>t</sub> | x<sub>0</sub>)?", "options": [{"text": "&#119977;(0.8&middot;x<sub>0</sub>, 0.36&middot;I)", "correct": true, "explanation": "q(x<sub>t</sub>|x<sub>0</sub>) = \ud835\udca9(\u221a&#8113;<sub>t</sub>\u00b7x<sub>0</sub>, (1\u2212&#8113;<sub>t</sub>)\u00b7I): the mean uses \u221a0.64 = 0.8 while the variance uses 1 \u2212 0.64 = 0.36. Mixing up where the square root lives is the classic slip."}, {"text": "&#119977;(0.64&middot;x<sub>0</sub>, 0.36&middot;I)", "explanation": "The variance is right, but the mean coefficient is \u221a&#8113;<sub>t</sub> = 0.8, not &#8113;<sub>t</sub> itself."}, {"text": "&#119977;(0.8&middot;x<sub>0</sub>, 0.6&middot;I)", "explanation": "The mean is right, but the variance is 1 \u2212 &#8113;<sub>t</sub> = 0.36 \u2014 no square root on the variance term."}, {"text": "&#119977;(0.64&middot;x<sub>0</sub>, 0.8&middot;I)", "explanation": "Both slots are off: mean \u221a&#8113;<sub>t</sub> = 0.8, variance 1 \u2212 &#8113;<sub>t</sub> = 0.36."}]}, {"id": "math-continuous-1", "section": "The Maths I: Continuous Diffusion", "question": "What does the &radic;(1&minus;&beta;<sub>t</sub>) factor in the forward kernel accomplish?", "options": [{"text": "It keeps the chain's variance at I, shrinking signal exactly as noise grows.", "correct": true, "explanation": "Var(x<sub>t</sub>) = (1\u2212\u03b2<sub>t</sub>)\u00b7I + \u03b2<sub>t</sub>\u00b7I = I \u2014 the variance-preserving property. Without the shrink, variance would blow up additively step after step."}, {"text": "It guarantees the exact reverse of each step is also a Gaussian distribution.", "explanation": "Near-Gaussian reversals come from \u03b2<sub>t</sub> being small (many gentle steps), not from the scaling factor."}, {"text": "It forces the chain's mean to zero regardless of what the data mean is.", "explanation": "The mean decays because the factor is < 1 compounded over steps, but the factor is chosen for the variance bookkeeping, not centering."}, {"text": "It makes the noise schedule's cumulative product &#8113;<sub>t</sub> increase monotonically.", "explanation": "&#8113;<sub>t</sub> <em>decreases</em> monotonically toward 0 \u2014 that's the point: signal must die by time T."}]}, {"id": "math-continuous-2", "section": "The Maths I: Continuous Diffusion", "question": "In the ELBO decomposition, the prior term KL( q(x<sub>T</sub>|x<sub>0</sub>) &Vert; &#119977;(0, I) ) is special because it is...", "options": [{"text": "Parameter-free, and &asymp;0 whenever the schedule fully destroys the signal.", "correct": true, "explanation": "Neither q(x<sub>T</sub>|x<sub>0</sub>) nor \ud835\udca9(0,I) contains \u03b8, so it contributes no gradient; with &#8113;<sub>T</sub> \u2248 0 the two distributions nearly coincide and the KL vanishes. It's a schedule-design sanity check, not a training signal."}, {"text": "The largest of the three terms, and therefore minimized first in training.", "explanation": "It's typically the <em>smallest</em> (\u22480 by design), and with no parameters inside there is nothing to minimize."}, {"text": "The only term that must be estimated by Monte-Carlo sampling.", "explanation": "All terms are estimated by sampling t and \u03b5 during training; this one happens to be computable in closed form and ignorable."}, {"text": "Equal to the reconstruction term by the time-symmetry of the chain.", "explanation": "There is no such symmetry \u2014 reconstruction concerns the near-clean end (t=1), the prior term the fully-noised end (t=T)."}]}, {"id": "math-continuous-3", "section": "The Maths I: Continuous Diffusion", "question": "Set &sigma;<sub>t</sub> = 0 in the DDIM family. Which update rule results?", "options": [{"text": "x<sub>t&minus;1</sub> = &radic;&#8113;<sub>t&minus;1</sub>&middot;x&#770;<sub>0</sub> + &radic;(1&minus;&#8113;<sub>t&minus;1</sub>)&middot;&epsilon;<sub>&theta;</sub>", "correct": true, "explanation": "With \u03c3 = 0 the fresh-noise term dies and \u221a(1\u2212&#8113;<sub>t\u22121</sub>\u2212\u03c3\u00b2) becomes \u221a(1\u2212&#8113;<sub>t\u22121</sub>): rescaled clean estimate plus rescaled predicted noise, fully deterministic \u2014 the property that lets the sampler skip steps."}, {"text": "x<sub>t&minus;1</sub> = &radic;&#8113;<sub>t&minus;1</sub>&middot;x<sub>t</sub> + &radic;(1&minus;&#8113;<sub>t&minus;1</sub>)&middot;&epsilon;<sub>&theta;</sub>", "explanation": "This reuses the noisy x<sub>t</sub> where the clean estimate x&#770;<sub>0</sub> belongs \u2014 the signal term must be rebuilt from the model's denoised guess."}, {"text": "x<sub>t&minus;1</sub> = &radic;(1&minus;&#8113;<sub>t&minus;1</sub>)&middot;x&#770;<sub>0</sub> + &radic;&#8113;<sub>t&minus;1</sub>&middot;&epsilon;<sub>&theta;</sub>", "explanation": "Coefficients swapped: signal carries \u221a&#8113;<sub>t\u22121</sub>, noise direction carries \u221a(1\u2212&#8113;<sub>t\u22121</sub>) \u2014 same bookkeeping as the forward marginal."}, {"text": "x<sub>t&minus;1</sub> = x&#770;<sub>0</sub> + &radic;(1&minus;&#8113;<sub>t&minus;1</sub>)&middot;&epsilon;<sub>&theta;</sub>", "explanation": "The clean estimate must be rescaled by \u221a&#8113;<sub>t\u22121</sub> to sit at the right signal level for time t\u22121; without it the marginals no longer match."}]}, {"id": "math-continuous-4", "section": "The Maths I: Continuous Diffusion", "question": "How is the trained noise-prediction network related to the score of the noisy marginal?", "options": [{"text": "s<sub>&theta;</sub>(x<sub>t</sub>) = &minus;&epsilon;<sub>&theta;</sub>(x<sub>t</sub>, t) / &radic;(1&minus;&#8113;<sub>t</sub>)", "correct": true, "explanation": "From q(x<sub>t</sub>|x<sub>0</sub>): \u2207 log q = \u2212(x<sub>t</sub> \u2212 \u221a&#8113;<sub>t</sub>x<sub>0</sub>)/(1\u2212&#8113;<sub>t</sub>) = \u2212\u03b5/\u221a(1\u2212&#8113;<sub>t</sub>). Predicting noise is estimating the gradient field of the log-density \u2014 the bridge between DDPM and score-based SDEs."}, {"text": "s<sub>&theta;</sub>(x<sub>t</sub>) = &minus;&radic;(1&minus;&#8113;<sub>t</sub>) &middot; &epsilon;<sub>&theta;</sub>(x<sub>t</sub>, t)", "explanation": "Off by the square of the factor \u2014 you divide by \u221a(1\u2212&#8113;<sub>t</sub>), not multiply. As noise grows the score flattens, which the division captures."}, {"text": "s<sub>&theta;</sub>(x<sub>t</sub>) = &epsilon;<sub>&theta;</sub>(x<sub>t</sub>, t) / &radic;&#8113;<sub>t</sub>", "explanation": "Wrong sign and wrong normalizer: the score points <em>against</em> the added noise and is scaled by the noise level, not the signal level."}, {"text": "s<sub>&theta;</sub>(x<sub>t</sub>) = &minus;&nabla;<sub>x</sub> &epsilon;<sub>&theta;</sub>(x<sub>t</sub>, t)", "explanation": "No differentiation of the network is involved \u2014 the relation is a simple rescaling that falls out of the Gaussian closed form."}]}, {"id": "math-discrete-0", "section": "The Maths II: Masked Discrete Diffusion", "question": "Take &alpha;<sub>s</sub> = 0.75 and &alpha;<sub>t</sub> = 0.25 (s the less-noisy time). A token masked at t is revealed when stepping to s with probability...", "options": [{"text": "2/3", "correct": true, "explanation": "(\u03b1<sub>s</sub> \u2212 \u03b1<sub>t</sub>)/(1 \u2212 \u03b1<sub>t</sub>) = 0.5/0.75 = 2/3. The denominator conditions on being masked at t \u2014 forgetting it is the standard error."}, {"text": "1/3", "explanation": "That's the complementary stay-masked probability, (1 \u2212 \u03b1<sub>s</sub>)/(1 \u2212 \u03b1<sub>t</sub>) = 0.25/0.75."}, {"text": "1/2", "explanation": "That's the bare difference \u03b1<sub>s</sub> \u2212 \u03b1<sub>t</sub> without normalizing by the probability 1 \u2212 \u03b1<sub>t</sub> of being masked at t in the first place."}, {"text": "3/4", "explanation": "That's \u03b1<sub>s</sub> itself \u2014 the unconditional survival probability at s, not the conditional reveal probability for a token currently masked."}]}, {"id": "math-discrete-1", "section": "The Maths II: Masked Discrete Diffusion", "question": "What do MDLM's two SUBS constraints (zero mask-probability and carry-over unmasking) actually buy?", "options": [{"text": "Several ELBO terms vanish identically, leaving a lower-variance weighted MLM loss.", "correct": true, "explanation": "Substituting the constraints makes whole terms of the bound zero <em>analytically</em> \u2014 Rao-Blackwellization. What survives is exactly the weighted masked cross-entropy, simple to implement and lower-variance to estimate."}, {"text": "The sampler gains the ability to remask and revise already-committed tokens.", "explanation": "Revision is ReMDM's contribution, and it lives in the sampler. SUBS is about making the training objective exact and tight."}, {"text": "The forward process no longer requires an absorbing mask state to work.", "explanation": "The absorbing mask state is the heart of the formulation; SUBS shapes the reverse-side parameterization built on top of it."}, {"text": "The model's likelihood becomes exactly equal to that of an AR factorization.", "explanation": "The NELBO stays an upper bound on \u2212log p; MDLM narrows the gap to AR models but no equality is claimed."}]}, {"id": "math-discrete-2", "section": "The Maths II: Masked Discrete Diffusion", "question": "MDLM's continuous-time NELBO is provably invariant to...", "options": [{"text": "The functional form of the schedule &alpha;<sub>t</sub>, endpoints held fixed.", "correct": true, "explanation": "A change of variables absorbs the schedule: any strictly-decreasing \u03b1<sub>t</sub> from \u22481 to \u22480 yields the same objective value. Schedules still affect gradient variance \u2014 but not what is being optimized."}, {"text": "The length of the sequences that the model is trained on.", "explanation": "Length isn't invariant-out \u2014 the loss sums over positions; longer sequences mean more terms."}, {"text": "The size of the vocabulary the tokenizer produces.", "explanation": "Cross-entropy depends directly on the support size; per-token likelihoods are not vocabulary-invariant."}, {"text": "The parameterization chosen for the denoiser x<sub>&theta;</sub>.", "explanation": "Parameterization matters a great deal \u2014 SUBS is precisely a parameterization choice that tightens and simplifies the bound."}]}, {"id": "math-discrete-3", "section": "The Maths II: Masked Discrete Diffusion", "question": "With the linear schedule &alpha;<sub>t</sub> = 1 &minus; t, the weight w(t) multiplying the masked cross-entropy at corruption level t is...", "options": [{"text": "1/t", "correct": true, "explanation": "w(t) = \u2212\u03b1\u2032<sub>t</sub>/(1 \u2212 \u03b1<sub>t</sub>) = 1/t for the linear schedule. Lightly-masked examples (small t) get a large per-token weight but contribute few masked tokens \u2014 the effects balance across the integral."}, {"text": "t", "explanation": "Inverted: the weight <em>decreases</em> with corruption level under the linear schedule \u2014 heavily-masked examples get weight \u22481, not \u22480."}, {"text": "1/(1&minus;t)", "explanation": "That's 1/\u03b1<sub>t</sub> \u2014 the survival probability's reciprocal, not \u2212\u03b1\u2032<sub>t</sub>/(1 \u2212 \u03b1<sub>t</sub>) = 1/t."}, {"text": "e<sup>&minus;t</sup>", "explanation": "Nothing exponential appears: \u2212\u03b1\u2032<sub>t</sub> = 1 and 1 \u2212 \u03b1<sub>t</sub> = t give exactly 1/t."}]}, {"id": "math-discrete-4", "section": "The Maths II: Masked Discrete Diffusion", "question": "diffu-GRPO (the d1 paper) needs per-token log-probs, which a dLLM doesn't define left-to-right. How does it estimate them?", "options": [{"text": "One forward pass with the completion fully masked; read per-position probabilities.", "correct": true, "explanation": "A mean-field one-step estimate \u2014 cheap enough to run inside an RL loop. Random re-masking of the prompt at each gradient step decorrelates successive estimates and regularizes, enabling several updates per batch of rollouts."}, {"text": "Averaging log-probabilities over full multi-step reverse trajectories.", "explanation": "That's the expensive quasi-exact route the one-step estimator exists to avoid \u2014 running it inside RL would multiply training cost by the step count."}, {"text": "A separate learned value network that scores each token's contribution.", "explanation": "GRPO's defining feature is having no value network \u2014 advantages are group-relative statistics of sampled completions' rewards."}, {"text": "Chain-rule decomposition after ordering tokens by model confidence.", "explanation": "No ordering rescues a left-to-right factorization the model doesn't define; d1 embraces the parallel mean-field estimate instead."}]}, {"id": "papers-0", "section": "The Nine Papers", "question": "Which pairing of vanilla-masked-diffusion limitation \u2192 fixing paper is correct?", "options": [{"text": "Fixed-length canvas and lost KV caching \u2192 Block Diffusion.", "correct": true, "explanation": "AR-across-blocks restores variable length and cached prefixes; diffusion-within-blocks keeps the parallelism. The other three pairings each swap in the wrong paper: frozen tokens is ReMDM's target, steering is Guidance, likelihood competitiveness is MDLM."}, {"text": "Frozen committed tokens \u2192 Discrete Diffusion Guidance.", "explanation": "Frozen tokens are ReMDM's territory (the marginal-preserving remasking sampler). Guidance is about steering generation toward attributes."}, {"text": "No steerability toward attributes \u2192 Remasking Diffusion.", "explanation": "Steering is the Guidance paper's contribution (the \u03b3-sharpened conditional ratio). ReMDM is about revising committed tokens."}, {"text": "Uncompetitive likelihoods versus AR models \u2192 d1 Reasoning.", "explanation": "Closing the perplexity gap was MDLM's achievement; d1 is about adding reasoning through SFT + diffusion-adapted RL."}]}, {"id": "papers-1", "section": "The Nine Papers", "question": "Why does ReMDM work with an off-the-shelf pretrained MDLM, with no retraining at all?", "options": [{"text": "Its sampler preserves the forward marginals, so every visited state looks like training data.", "correct": true, "explanation": "The remasking kernel is constructed so per-token marginals stay \u03b1<sub>t</sub>x + (1\u2212\u03b1<sub>t</sub>)m \u2014 and a remasked token is indistinguishable from an ordinarily masked one. In-distribution states are the whole license."}, {"text": "It only ever remasks the tokens the model originally predicted with low confidence.", "explanation": "Remasking policies can be confidence-aware, but that's a heuristic layered on top \u2014 the no-retraining guarantee comes from marginal preservation, not from which tokens get picked."}, {"text": "It attaches a small trained adapter that specializes in handling remasked inputs.", "explanation": "No new parameters are involved anywhere \u2014 ReMDM is purely a change to the sampling procedure."}, {"text": "MDLM training already includes remasking as one of its data augmentations.", "explanation": "MDLM's forward process only ever masks monotonically; no remasking appears in training. It doesn't need to \u2014 masked is masked, however it got that way."}]}, {"id": "papers-2", "section": "The Nine Papers", "question": "DPO eliminates the explicit reward model by...", "options": [{"text": "Inverting the closed-form optimal policy of the KL-regularized objective to rewrite the reward.", "correct": true, "explanation": "\u03c0*(y|x) \u221d \u03c0<sub>ref</sub>(y|x)\u00b7exp(r/\u03b2) inverts to r = \u03b2\u00b7log(\u03c0/\u03c0<sub>ref</sub>) + const; substituted into Bradley\u2013Terry, the partition function cancels and a simple classification loss on preference pairs remains."}, {"text": "Distilling PPO rollouts from a stronger teacher model into the policy.", "explanation": "No distillation and no PPO anywhere \u2014 avoiding that machinery is the paper's selling point."}, {"text": "Scoring preferences with the raw perplexity gap between the two answers.", "explanation": "Close in flavor but not it: the implicit reward is the log-probability <em>ratio against a frozen reference policy</em>, scaled by \u03b2 \u2014 not a raw perplexity difference \u2014 and it's derived, not assumed."}, {"text": "Alternating between reward-model fitting and policy updates inside one loop.", "explanation": "That alternation is roughly what classic RLHF does; DPO's contribution is collapsing the two stages into a single supervised loss."}]}, {"id": "papers-3", "section": "The Nine Papers", "question": "Which claim about FlashAttention is FALSE?", "options": [{"text": "It sparsifies the attention pattern to cut the number of floating-point operations.", "correct": true, "explanation": "FlashAttention is <em>exact</em> \u2014 every query still attends to every key, and FLOPs slightly increase (backward-pass recomputation). The speedup is entirely from IO: tiling into SRAM and never materializing the N\u00d7N matrix in HBM."}, {"text": "It processes Q, K, V in tiles sized to fit in on-chip SRAM.", "explanation": "True \u2014 tiling with an online softmax is the core mechanism, keeping the working set in fast memory."}, {"text": "It avoids materializing the N&times;N attention matrix in GPU main memory.", "explanation": "True \u2014 that avoided read/write traffic is where the wall-clock win comes from."}, {"text": "It recomputes attention during the backward pass instead of storing it.", "explanation": "True \u2014 recomputation trades cheap FLOPs for expensive memory, the same IO-aware logic."}]}, {"id": "papers-4", "section": "The Nine Papers", "question": "At inference time, a Decision Transformer produces good actions by...", "options": [{"text": "Conditioning on a high desired return-to-go and predicting the next action.", "correct": true, "explanation": "RL as conditional sequence modeling: prompt the model with the outcome you want and let it emit the actions consistent with achieving it. No value function, no planning \u2014 and a direct ancestor of d1's conviction that sequence models can absorb RL."}, {"text": "Rolling out a learned world model and selecting the best imagined trajectory.", "explanation": "That's model-based planning (e.g. MuZero's family); DT never simulates the environment."}, {"text": "Maximizing a Q-function that was trained on the same offline dataset.", "explanation": "Dispensing with value functions is the paper's point \u2014 conditioning replaces maximization."}, {"text": "Sampling many candidate actions and reranking them with a reward model.", "explanation": "No reranking stage exists; the return-to-go conditioning does the selection implicitly in one pass."}]}];</script>
<script>
const BANK = window.__BANK__;
const KEY = 'sr:diffusion-language-models';
const DAY = 86400000;
const INT = [0, 1, 3, 7, 14, 30];                    // days per box
const $ = id => document.getElementById(id);
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
function copyText(t) {
  const go = () => { const ta = document.createElement('textarea'); ta.value = t;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {} ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).catch(go); else go();
}
let state = load(), queue = [], idx = 0, session = { seen: 0, firstTryRight: 0, wrong: [] };

function dueList() {
  const now = Date.now();
  return BANK.filter(q => { const e = state[q.id]; return !e || e.due <= now; });
}
function refreshStats() {
  const now = Date.now();
  let neu = 0, due = 0, learned = 0;
  BANK.forEach(q => {
    const e = state[q.id];
    if (!e) neu++;
    else if (e.due <= now) due++;
    if (e && e.box >= 4) learned++;
  });
  $('st-due').textContent = due; $('st-new').textContent = neu;
  $('st-learned').textContent = learned; $('st-total').textContent = BANK.length;
  $('start').disabled = (due + neu) === 0;
  $('start').textContent = (due + neu) ? ('start review (' + (due + neu) + ' cards)') : 'nothing due — come back later';
}
function startSession() {
  queue = dueList(); idx = 0;
  session = { seen: 0, firstTryRight: 0, wrong: [] };
  if (!queue.length) return;
  $('home').classList.add('hidden'); $('play').classList.remove('hidden');
  showCard();
}
function schedule(q, correct, firstTry) {
  const e = state[q.id] || { box: 0, reps: 0, lapses: 0 };
  if (correct) {
    e.box = firstTry ? Math.min(e.box + 1, 5) : 1;
    e.due = Date.now() + INT[e.box] * DAY;
  } else {
    e.lapses++; e.box = 0; e.due = Date.now();      // retried within session
  }
  e.reps++; state[q.id] = e; save(state);
}
function showCard() {
  if (idx >= queue.length) return endSession();
  const q = queue[idx];
  const host = $('card'); host.innerHTML = '';
  const sec = document.createElement('div'); sec.className = 'qsec';
  sec.textContent = q.section + ' · card ' + (idx + 1) + '/' + queue.length;
  const qt = document.createElement('div'); qt.className = 'qtext'; qt.innerHTML = q.question;
  host.appendChild(sec); host.appendChild(qt);
  const opts = q.options.map((o, i) => ({ o, i }));
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  const btns = [];
  opts.forEach(({ o }) => {
    const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = o.text;
    b.__o = o;
    b.addEventListener('click', () => {
      btns.forEach(x => {
        x.disabled = true;
        if (x.__o.correct) x.classList.add('right');
        const ex = document.createElement('div');
        ex.className = 'expl ' + (x.__o.correct ? 'right' : 'wrong');
        ex.innerHTML = (x.__o.correct ? '<strong>✓</strong> ' : '<strong>✗</strong> ') + (x.__o.explanation || '');
        x.insertAdjacentElement('afterend', ex);
      });
      const firstTry = !q.__retried;
      if (!o.correct) b.classList.add('wrong');
      if (firstTry) { session.seen++; if (o.correct) session.firstTryRight++; else session.wrong.push(q.question.replace(/<[^>]*>/g, '')); }
      schedule(q, !!o.correct, firstTry);
      const nxt = document.createElement('button'); nxt.className = 'btn'; nxt.style.marginTop = '.8rem';
      if (o.correct) {
        const e = state[q.id];
        nxt.textContent = 'next — back in ' + (INT[e.box] || '<1') + ' day(s)';
        nxt.addEventListener('click', () => { idx++; showCard(); });
      } else {
        nxt.textContent = 'got it — retry this card later in the session';
        nxt.addEventListener('click', () => { q.__retried = true; queue.push(q); idx++; showCard(); });
      }
      host.appendChild(nxt);
    });
    btns.push(b); host.appendChild(b);
  });
}
function endSession() {
  $('play').classList.add('hidden'); $('doneBox').classList.remove('hidden');
  $('doneStats').textContent = session.firstTryRight + '/' + session.seen + ' correct on first try';
  refreshStats();
}
function summary() {
  const lines = ['Spaced-review session — diffusion language models — ' + new Date().toISOString().slice(0, 10)];
  lines.push('First-try score: ' + session.firstTryRight + '/' + session.seen);
  if (session.wrong.length) lines.push('Missed: ' + session.wrong.map(w => '"' + w + '"').join('; '));
  const weak = BANK.filter(q => (state[q.id] || {}).lapses > 1).map(q => '"' + q.question.replace(/<[^>]*>/g, '') + '"');
  if (weak.length) lines.push('Chronic weak spots (2+ lapses): ' + weak.join('; '));
  lines.push('Please re-teach my weak areas from first principles, then quiz me harder on them.');
  return lines.join('\n');
}
$('start').addEventListener('click', startSession);
$('copyRes').addEventListener('click', function () {
  copyText(summary()); this.textContent = 'copied ✓';
  setTimeout(() => { this.textContent = 'copy results for Claude'; }, 1500);
});
$('again').addEventListener('click', () => {
  $('doneBox').classList.add('hidden'); $('home').classList.remove('hidden'); refreshStats();
});
$('reset').addEventListener('click', () => {
  if (confirm('Erase all review progress?')) { state = {}; save(state); refreshStats(); }
});
refreshStats();
</script>
</body>
</html>
